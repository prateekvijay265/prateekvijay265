<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040908" />
      <stop offset="40%" stop-color="#071917" />
      <stop offset="80%" stop-color="#0a2623" />
      <stop offset="100%" stop-color="#051210" />
    </linearGradient>

    <!-- Neural Glow Gradients -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amber-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambient-cyan" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#115e59" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#040908" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b3d38" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e6fff9" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Chakra Petch', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .mono-sub {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 3.5px;
      font-size: 13px;
      font-weight: 600;
    }
    .badge-label {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 600;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }
    @keyframes pulse-fast {
      0%, 100% { r: 3.5; opacity: 0.7; }
      50% { r: 5.5; opacity: 1; }
    }
    .synapse {
      stroke-dasharray: 4, 4;
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .node-pulse {
      animation: pulse-fast 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="320" fill="url(#ambient-cyan)" rx="16" />
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- Accent top and bottom borders -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#bar-grad)" />
  <rect x="0" y="317" width="1200" height="3" fill="url(#bar-grad)" />

  <!-- ================= NEURAL NETWORK CONSTELLATION (Right side) ================= -->
  <g transform="translate(620, 20)">
    <!-- Neural Glow Backdrops -->
    <circle cx="280" cy="130" r="140" fill="url(#cyan-glow)" opacity="0.3" />
    <circle cx="440" cy="180" r="100" fill="url(#amber-glow)" opacity="0.25" />

    <!-- Synaptic Connectors -->
    <g stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.35">
      <line x1="60" y1="140" x2="160" y2="70" />
      <line x1="60" y1="140" x2="140" y2="190" />
      <line x1="60" y1="140" x2="190" y2="130" />
      
      <line x1="160" y1="70" x2="270" y2="50" />
      <line x1="160" y1="70" x2="250" y2="120" />
      <line x1="140" y1="190" x2="230" y2="220" />
      <line x1="140" y1="190" x2="250" y2="120" />
      <line x1="190" y1="130" x2="310" y2="150" />
      
      <line x1="270" y1="50" x2="380" y2="60" />
      <line x1="270" y1="50" x2="310" y2="150" />
      <line x1="250" y1="120" x2="380" y2="130" />
      <line x1="230" y1="220" x2="340" y2="240" />
      <line x1="230" y1="220" x2="380" y2="180" />
      <line x1="310" y1="150" x2="380" y2="130" />
      <line x1="310" y1="150" x2="380" y2="180" />
      
      <line x1="380" y1="60" x2="480" y2="90" />
      <line x1="380" y1="60" x2="460" y2="160" />
      <line x1="380" y1="130" x2="460" y2="160" />
      <line x1="380" y1="180" x2="480" y2="210" />
      <line x1="380" y1="180" x2="460" y2="160" />
      <line x1="340" y1="240" x2="480" y2="210" />
      <line x1="460" y1="160" x2="530" y2="140" />
      <line x1="480" y1="90" x2="530" y2="140" />
      <line x1="480" y1="210" x2="530" y2="140" />
    </g>

    <!-- Active Pulsing Data Links -->
    <g stroke="#5eead4" stroke-width="1.8" class="synapse">
      <line x1="160" y1="70" x2="250" y2="120" />
      <line x1="250" y1="120" x2="380" y2="130" />
      <line x1="380" y1="130" x2="460" y2="160" />
      <line x1="460" y1="160" x2="530" y2="140" />
      <line x1="230" y1="220" x2="380" y2="180" stroke="#fbbf24" stroke-opacity="0.8" />
    </g>

    <!-- Neural Nodes (Circles) -->
    <!-- Input Layer -->
    <circle cx="60" cy="140" r="4.5" fill="#5eead4" />
    <circle cx="160" cy="70" r="4" fill="#5eead4" />
    <circle cx="140" cy="190" r="4" fill="#5eead4" />
    <circle cx="190" cy="130" r="3.5" fill="#5eead4" opacity="0.8" />

    <!-- Hidden Layers -->
    <circle cx="270" cy="50" r="4.5" fill="#38bdf8" />
    <circle cx="250" cy="120" r="6" fill="#5eead4" class="node-pulse" />
    <circle cx="230" cy="220" r="4.5" fill="#fbbf24" />
    
    <circle cx="310" cy="150" r="4" fill="#5eead4" />
    <circle cx="380" cy="60" r="4" fill="#38bdf8" />
    <circle cx="380" cy="130" r="7" fill="#5eead4" />
    <circle cx="380" cy="180" r="5" fill="#fbbf24" />
    <circle cx="340" cy="240" r="3.5" fill="#5eead4" opacity="0.7" />

    <!-- Output Layer -->
    <circle cx="480" cy="90" r="4" fill="#38bdf8" />
    <circle cx="460" cy="160" r="7.5" fill="#5eead4" class="node-pulse" />
    <circle cx="480" cy="210" r="5.5" fill="#fbbf24" />
    <circle cx="530" cy="140" r="9" fill="#5eead4" />
    <circle cx="530" cy="140" r="15" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3 3" />
  </g>

  <!-- ================= LEFT IDENTITY & CONTENT ================= -->
  <g transform="translate(60, 48)">
    <!-- Terminal Tag -->
    <g transform="translate(0, 0)">
      <rect width="170" height="26" rx="13" fill="#0c2e29" stroke="#1d665a" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#5eead4" />
      <text x="27" y="17" fill="#5eead4" class="badge-label">AI · ML · RESEARCH</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" fill="url(#text-grad)" font-size="56" class="title-text">
      PRATEEK VIJAY
    </text>

    <!-- Subtitle Tagline -->
    <text x="0" y="128" fill="#5eead4" class="mono-sub">
      SYSTEMS THAT JUDGE, NOT JUST PREDICT
    </text>

    <!-- Description / Core Vectors -->
    <text x="0" y="162" fill="#9ab5ae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Multi-Model Detection · Voice RAG Pipeline · Zero-Trust Security · Executive Analytics
    </text>

    <!-- Mini Feature Badges -->
    <g transform="translate(0, 192)">
      <!-- Badge 1: 16 Risk Signals -->
      <g transform="translate(0, 0)">
        <rect width="158" height="28" rx="6" fill="#081e1c" stroke="#184b44" stroke-width="1" />
        <text x="12" y="18" fill="#5eead4" class="badge-label">⚡ 16 RISK SIGNALS</text>
      </g>
      <!-- Badge 2: Voice RAG -->
      <g transform="translate(168, 0)">
        <rect width="186" height="28" rx="6" fill="#081e1c" stroke="#184b44" stroke-width="1" />
        <text x="12" y="18" fill="#38bdf8" class="badge-label">🎙 VOICE RAG PIPELINE</text>
      </g>
      <!-- Badge 3: Zero-Trust -->
      <g transform="translate(364, 0)">
        <rect width="174" height="28" rx="6" fill="#081e1c" stroke="#184b44" stroke-width="1" />
        <text x="12" y="18" fill="#fbbf24" class="badge-label">🛡 ZERO-TRUST AUTH</text>
      </g>
    </g>
  </g>
</svg>
